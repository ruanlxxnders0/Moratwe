{% extends 'base.html' %}

{% block title %}Password Reset Complete | Moratwe{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Password Reset Complete</h2>
            <p class="text-gray-600">Your password has been successfully reset.</p>
        </div>
        
        <div class="text-center">
            <a href="{% url 'login' %}" class="inline-block bg-primary hover:bg-primary-dark text-white font-medium py-3 px-6 rounded focus:outline-none focus:shadow-outline transition duration-200">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
