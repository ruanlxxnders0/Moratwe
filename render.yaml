services:
  - type: web
    name: moratwe-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn moratwe.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: moratwe.settings.production
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@moratwe.co.za
      - key: SENDGRID_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
